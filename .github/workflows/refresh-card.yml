# Daily refresh of the gh-ascii profile card.
#
# Re-downloads both themes once a day (and on the "Run workflow" button) and
# commits only when the card changed. The work-account heat map in README.md is
# a live image and needs no refresh.
#
# GitHub pauses scheduled workflows after 60 days without repository activity;
# if the card stops updating, re-enable this workflow from the Actions tab.

name: Refresh gh-ascii card

on:
  schedule:
    - cron: "17 6 * * *"   # daily at 06:17 UTC (11:47 IST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-gh-ascii-card
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download both themes
        env:
          HANDLE: Siraj-786
          GH_ASCII_URL: https://gh.crafter.run
        run: |
          curl -fsSL --retry 3 --retry-delay 5 "$GH_ASCII_URL/$HANDLE?theme=dark" -o dark_mode.svg
          curl -fsSL --retry 3 --retry-delay 5 "$GH_ASCII_URL/$HANDLE?theme=light" -o light_mode.svg

      - name: Commit only if the card changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          if git diff --cached --quiet; then
            echo "Card unchanged, nothing to commit."
          else
            git commit -m "chore: refresh gh-ascii card"
            git push
          fi
